name: Deploy to SourceForge

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: web.sourceforge.net
          username: notenrechner
          password: ${{ secrets.SF_PASSWORD }}
          port: 22
          source: "index.html,ihk-notenschluessel-nrw.html,ihk-pruefung-bestehen.html,style.css,sitemap.xml,robots.txt,google9af9e77d417aecee.html"
          target: /home/project-web/notenrechner-tipps/htdocs/
