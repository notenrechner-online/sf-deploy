name: Deploy to SourceForge

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy via SCP
        run: |
          sshpass -p "${{ secrets.SF_PASSWORD }}" scp -o StrictHostKeyChecking=no -P 22 index.html ihk-notenschluessel-nrw.html ihk-pruefung-bestehen.html style.css sitemap.xml robots.txt google9af9e77d417aecee.html notenrechner@web.sourceforge.net:/home/project-web/notenrechner-tipps/htdocs/
